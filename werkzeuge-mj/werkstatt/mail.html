<script src="/besuch.js?v=3c4c57a56e" defer></script><script src="/verweil.js?v=5881fd455d" defer></script></head>
<body class="ml-seite">
<div class="ml">
  <header class="ml-kopf">
    <a class="ml-marke" href="index.html" title="Zur Übersicht"><span class="ml-zeichen" id="mlZeichen"></span><span class="ml-marke__n"><b>Drucksachen &amp; Feed</b><small>Newsletter & E-Mail</small></span></a>
    <input class="ml-name" id="mlName" aria-label="Name der E-Mail" spellcheck="false">
    <span class="ml-gespeichert" id="mlGespeichert">Gespeichert</span>
    <span class="ml-frei"></span>
    <div class="ml-geraet" role="group" aria-label="Ansicht">
      <button class="an" data-geraet="600" title="Bildschirm, 600 px"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg></button>
      <button data-geraet="375" title="Handy, 375 px"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg></button>
    </div>
    <details class="ml-pruefen" id="mlPruefen">
      <summary class="kn kn--klein kn--ohne"><span class="ml-pruef__zahl" id="mlPruefZahl">0</span><span>Prüfung</span></summary>
      <div class="ml-pruef__liste" id="mlPruefListe"></div>
    </details>
    <button class="kn kn--klein kn--ohne" id="mlFenster" title="In einem neuen Fenster ansehen"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>Ansehen</span></button>
    <button class="kn kn--klein kn--ohne" id="mlKopieren"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><span>HTML kopieren</span></button>
    <button class="kn ms-kn-gold" id="mlDatei"><span>Als Datei speichern</span><i><svg viewBox="0 0 24 24"><path d="M12 5v12m-5-5 5 5 5-5"/></svg></i></button>
  </header>

  <aside class="ml-links">
    <a class="ms-lnk ms-lnk--zurueck ml-zurueck" href="index.html"><svg viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></svg><span>Zur Übersicht</span></a>
    <div class="ml-kapitel"><span class="ml-kapitel__z" id="mlKapitelZeichen"></span><h1>Newsletter <span style="white-space:nowrap">&amp; E-Mail</span></h1><p>Versendbar, im Stil des Hauses</p></div>
    <h3>Vorlagen</h3>
    <nav class="ml-vorlagen" id="mlVorlagen"></nav>
    <div id="mlMeineBox" hidden>
      <h3>Meine E-Mails <em id="mlMeineZahl"></em></h3>
      <div class="ml-meine" id="mlMeine"></div>
    </div>
    <h3>Teile der E-Mail</h3>
    <nav class="ml-nav">
      <button data-teil="mail"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg><span>Betreff und Versand</span></button>
      <button data-teil="kopf"><svg viewBox="0 0 24 24"><path d="M4 4h16v7H4zM4 15h16M4 19h10"/></svg><span>Kopf und Kopfbild</span></button>
      <button data-teil="fuss"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 9h10M4 13h16v7H4z"/></svg><span>Fuss mit Adresse</span></button>
    </nav>
  </aside>

  <main class="ml-mitte">
    <div class="ml-buehne" id="mlBuehne">
      <div class="ml-posteingang">
        <span class="ml-pe__zeichen">M</span>
        <div><b>Maloja</b><span class="ml-pe__betreff" id="mlBetreff"></span><span class="ml-pe__vorschau" id="mlVorschau"></span></div>
      </div>
      <div class="ml-blatt" id="mlBlatt"><iframe id="mlRahmen" title="Vorschau der E-Mail" scrolling="no"></iframe><span class="ml-blatt__licht"></span></div>
      <span class="ml-boden"></span>
    </div>
  </main>

  <aside class="ml-rechts">
    <h3>Baustein einfügen</h3>
    <div class="ml-einfuegen" id="mlEinfuegen"></div>
    <div class="ml-felder" id="mlFelder"></div>
  </aside>
</div>

<dialog class="ml-fotos" id="mlFotos">
  <div class="ml-fotos__kopf"><h2>Fotos des Hauses</h2>
    <label class="ms-suche"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input type="search" id="mlFotoSuche" placeholder="Suchen: Abend, Saal …" aria-label="Fotos suchen"></label>
    <button class="rund" id="mlFotoZu" aria-label="Schliessen"><svg viewBox="0 0 24 24"><path d="M9 14.5 4 9.5l5-5M4 9.5h11a5 5 0 0 1 0 10h-3"/></svg></button></div>
  <div class="ms-chips ml-fotos__gruppen" id="mlFotoGruppen"></div>
  <div class="ml-fotos__raster" id="mlFotoRaster"></div>
</dialog>
<div class="ml-hinweis" id="mlHinweis" role="status" hidden></div>
